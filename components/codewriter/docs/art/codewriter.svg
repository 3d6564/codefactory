<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Codewriter</title>
  <desc id="desc">A developer request and project guidance pass through Codewriter into code, focused tests, and a review-ready change report.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#26324a" stroke-width="1"/>
    </pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f7ff"/>
      <stop offset="1" stop-color="#d2e3f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#050912" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="#0d1424"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)" opacity=".55"/>
  <path d="M0 286C172 233 304 330 469 280s294-40 402 3 214 42 329-13v90H0z" fill="#111d32"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="64" y="81" fill="#75b8ff" font-size="16" font-weight="700" letter-spacing="4">PLAN  /  IMPLEMENT  /  VERIFY</text>
    <text x="60" y="146" fill="#f0f7ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="64" font-weight="800" letter-spacing="-2">Codewriter</text>
    <text x="64" y="190" fill="#aebbd0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20">Turn project instructions into tested changes.</text>

    <g font-size="14" font-weight="700">
      <rect x="64" y="238" width="151" height="38" rx="19" fill="#18253d" stroke="#52627d"/>
      <circle cx="86" cy="257" r="5" fill="#f6ae4a"/>
      <text x="101" y="262" fill="#dce6f5">REQUEST</text>
      <rect x="64" y="288" width="151" height="38" rx="19" fill="#18253d" stroke="#52627d"/>
      <circle cx="86" cy="307" r="5" fill="#68d5c1"/>
      <text x="101" y="312" fill="#dce6f5">GUIDANCE</text>
    </g>

    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M215 257h74c29 0 29 25 54 25h41" stroke="#f6ae4a" stroke-width="3"/>
      <path d="M215 307h74c29 0 29-25 54-25h41" stroke="#68d5c1" stroke-width="3"/>
      <path d="M518 282h88" stroke="#75b8ff" stroke-width="3"/>
      <path d="m597 274 10 8-10 8" stroke="#75b8ff" stroke-width="3"/>
    </g>

    <g transform="translate(384 229)">
      <rect width="134" height="106" rx="18" fill="#18253d" stroke="#6f82a3"/>
      <path d="m45 36-15 17 15 17M89 36l15 17-15 17M76 29 58 77" fill="none" stroke="#75b8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="67" y="94" text-anchor="middle" fill="#75b8ff" font-size="11" font-weight="700">CODEWRITER</text>
    </g>

    <g transform="translate(633 45)" filter="url(#shadow)">
      <path d="M0 0h390l70 70v230H0z" fill="url(#paper)"/>
      <path d="M390 0v70h70" fill="#adc7e2"/>
      <path d="M390 0v70h70" fill="none" stroke="#7898ba" stroke-width="2"/>
      <text x="36" y="54" fill="#2866a5" font-size="13" font-weight="800" letter-spacing="3">SCOPED CHANGES</text>
      <text x="36" y="94" fill="#172e49" font-size="23" font-weight="800">CODE + TESTS</text>
      <path d="M36 112h352" stroke="#9eb6d0" stroke-width="2"/>

      <g font-size="14">
        <path d="m37 140 4 4 8-10M37 174l4 4 8-10M37 208l4 4 8-10" fill="none" stroke="#318979" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="60" y="147" fill="#313b4d">Readable implementation</text>
        <text x="60" y="181" fill="#313b4d">Focused tests and checks</text>
        <text x="60" y="215" fill="#313b4d">Changes, risks, and limits</text>
      </g>

      <path d="M36 246h352" stroke="#9eb6d0" stroke-width="2" stroke-dasharray="5 6"/>
      <rect x="36" y="261" width="245" height="28" rx="14" fill="#bdd3e9"/>
      <circle cx="52" cy="275" r="5" fill="#2866a5"/>
      <text x="65" y="280" fill="#294d73" font-size="11" font-weight="700">READY FOR INDEPENDENT REVIEW</text>
    </g>
  </g>
</svg>
